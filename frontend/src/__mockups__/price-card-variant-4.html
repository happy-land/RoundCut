<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Card Variant 4</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
      background: #eef4ff;
      padding: 40px 20px;
      color: #111827;
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
      border: 1px solid #dfe8ff;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #eef2ff;
      color: #3748c6;
      border-radius: 999px;
      padding: 6px 8px;
      font-weight: 700;
    }

    .summary {
      border: 1px solid #eaf0ff;
      background: #f8fbff;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .label {
      color: #64748b;
      font-size: 13px;
    }

    .value {
      font-weight: 700;
      color: #0f172a;
      font-size: 15px;
    }

    .value.total {
      font-size: 20px;
      color: #0f172a;
    }

    .note {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #edf2ff;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="title">Круг Ст45</div>
        <div class="status">Ø 6 мм</div>
      </div>

      <div class="summary">
        <div class="row">
          <span class="label">Цена / т</span>
          <span class="value">12 450 ₽</span>
        </div>
        <div class="row">
          <span class="label">Итого</span>
          <span class="value total">48 000 ₽</span>
        </div>
      </div>

      <div class="note">
        <span>9360.36 м</span>
        <span>Электроугли</span>
      </div>
    </div>
  </div>
</body>
</html>
